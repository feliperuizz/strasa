; Limites de upload. Fica em public/ porque o .user.ini vale para o diretório
; do script executado (public/index.php) — é o formato que o PHP-FPM/CGI do
; cPanel lê. Para mod_php (Apache com PHP embutido) valem os php_value do
; .htaccess ao lado.
;
; ATENÇÃO: o servidor ainda pode ter um teto próprio acima disso —
; em nginx é o client_max_body_size, no cPanel é o "Max upload size" do
; PHP selector. Se um arquivo grande continuar falhando com erro 413,
; o limite está lá, não aqui.

upload_max_filesize = 2048M
post_max_size = 2048M

; Upload grande é demorado: sem isso a request morre no meio.
max_execution_time = 3600
max_input_time = 3600

; O upload é feito em streaming para o bucket, então não precisa de memória
; proporcional ao arquivo — 512M é folga suficiente.
memory_limit = 512M

; Quantidade de arquivos por envio (o campo é files[] múltiplo).
max_file_uploads = 50
